{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block auth %}
<div class="auth-card">
  <span class="logo"><span class="mark">CE</span> Conversion Engine</span>
  <h2>Welcome back</h2>
  <p class="muted" style="margin:0 0 8px">Log in to your workspace.</p>
  {% if error %}<div class="banner bad">{{ error }}</div>{% endif %}
  <form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email</label>
    <input type="email" name="email" required autofocus placeholder="you@company.com">
    <label>Password</label>
    <div class="pw-wrap">
      <input type="password" name="password" required placeholder="••••••••••">
      <button type="button" class="pw-toggle" aria-label="Show password" title="Show password">
        <svg class="ico-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="ico-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <button>Log in</button>
  </form>
</div>
{% endblock %}
