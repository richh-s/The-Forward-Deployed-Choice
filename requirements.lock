# Fully pinned transitive dependency set.
#
# Generate on the SAME Python the deployment runs (3.12 — see .python-version,
# render.yaml PYTHON_VERSION and Dockerfile). A lock resolved on a different
# minor can pin different versions for environment-marked dependencies, so the
# file would not describe what actually ships.
#
#   python3.12 -m venv .lockenv && .lockenv/bin/pip install -r requirements.txt
#   .lockenv/bin/pip freeze | sort -f
#
# Regenerate whenever requirements.txt changes. Install in production with:
#   pip install -r requirements.txt -c requirements.lock
#
# CI verifies on 3.12 that the lock is installable and internally consistent
# (see the "Lock file is valid on the deployment Python" step), so drift fails
# the build rather than surfacing at deploy time.
