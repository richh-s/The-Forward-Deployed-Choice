[project]
name = "conversion-engine"
version = "1.0.0"
description = "Multi-tenant AI outbound conversion platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["engine/**/*.py", "tests/**/*.py", "server.py", "worker.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic
