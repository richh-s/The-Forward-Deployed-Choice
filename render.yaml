databases:
  - name: engine-db
    plan: basic-256mb
    databaseName: engine
    user: engine

services:
  - type: web
    name: conversion-engine
    runtime: python
    plan: starter  # free tier spins down and pauses the worker/scheduler
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: engine-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false          # set to the public URL after first deploy
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LIVE_MODE
        value: "false"       # flip to "true" only after go-live sign-off
      - key: SINK_EMAIL
        sync: false
      - key: SINK_PHONE
        sync: false
      - key: RUN_WORKER
        value: "true"
      - key: LOG_LEVEL
        value: INFO
