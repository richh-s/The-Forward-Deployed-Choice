databases:
  - name: engine-db
    plan: basic-1gb        # 256mb fills fast — message bodies are stored per tenant
    databaseName: engine
    user: engine

services:
  # Web: dashboard + webhooks. No worker/scheduler in this process — those
  # run in the dedicated worker service below so a slow LLM job can never
  # stall webhook handling, and the web tier can scale horizontally.
  - type: web
    name: conversion-engine
    runtime: python
    plan: starter          # free tier spins down; never use it in production
    # Render's native build image ships Node alongside Python, so the
    # Next.js dashboard (served at /app) builds here too. If Node is ever
    # unavailable in the build environment, deploy with the Dockerfile
    # instead (it has a dedicated frontend build stage).
    buildCommand: >-
      pip install -r requirements.txt -c requirements.lock &&
      cd frontend && npm ci --no-audit --no-fund && npm run build
    preDeployCommand: alembic upgrade head
    # --proxy-headers so request.url reflects the original https scheme
    # (Twilio signature verification signs the public URL). Render's proxy
    # is the only ingress, so trusting forwarded headers is safe here.
    startCommand: >-
      uvicorn server:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: engine-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true   # required by /setup — read it from the dashboard
      - key: BASE_URL
        sync: false           # set to the public https URL after first deploy
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false           # only for identity-linked ("All workspaces")
                              # keys; a workspace-scoped key needs no value
      - key: SENTRY_DSN
        sync: false           # optional but strongly recommended
      - key: LANGFUSE_PUBLIC_KEY
        sync: false           # optional; enables LLM tracing
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
      - key: LIVE_MODE
        value: "false"        # flip to "true" only after go-live sign-off
      - key: SINK_EMAIL
        sync: false
      - key: SINK_PHONE
        sync: false
      - key: RUN_WORKER
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

  # Worker: job queue + scheduler. Safe to scale; job claiming uses
  # SKIP LOCKED and the scheduler takes an advisory lock per pass.
  - type: worker
    name: conversion-engine-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt -c requirements.lock
    startCommand: python -m worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: engine-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: APP_SECRET_KEY
        fromService:
          type: web
          name: conversion-engine
          envVarKey: APP_SECRET_KEY
      - key: BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false           # only for identity-linked ("All workspaces")
                              # keys; a workspace-scoped key needs no value
      - key: SENTRY_DSN
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false           # the worker makes the LLM calls — it needs these
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LIVE_MODE
        value: "false"
      - key: SINK_EMAIL
        sync: false
      - key: SINK_PHONE
        sync: false
      - key: RUN_WORKER
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
